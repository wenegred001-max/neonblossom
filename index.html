<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --node-size: 20px;
            --border-color: #cbd5e1;
            --plat-glow: rgba(226, 232, 240, 0.4);
        }

        html, body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: transparent;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .minimap-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 280px;
            height: 280px;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
            box-sizing: border-box;
            border: 2px solid var(--border-color);
            box-shadow: 0 0 16px var(--plat-glow), inset 0 0 12px rgba(226, 232, 240, 0.15);
            border-radius: 4px;
        }

        .minimap-overlay.no-border {
            border-color: transparent !important;
            box-shadow: none !important;
        }

        .minimap-overlay.pos-right { 
            left: auto; 
            right: 0; 
        }

        .spawn-node {
            position: absolute;
            width: var(--node-size);
            height: var(--node-size);
            transform: translate(-50%, -50%);
        }

        .spawn-node svg { width: 100%; height: 100%; overflow: visible; }
        .spawn-node circle.bg { stroke: rgba(15, 23, 42, 0.9); stroke-width: 3; fill: rgba(13, 17, 23, 0.92); }
        .spawn-node circle.progress {
            stroke-width: 4; 
            fill: none; 
            stroke-linecap: round;
            stroke-dasharray: 100;
            stroke-dashoffset: 0;
            transform: rotate(-90deg); 
            transform-origin: 50% 50%;
            transition: stroke-dashoffset 0.3s linear;
        }

        .spawn-node text { font-size: 14px; dominant-baseline: central; text-anchor: middle; transition: opacity 0.2s; }
        .hide-icons .spawn-node text { opacity: 0 !important; }

        .wisdom circle.progress { stroke: var(--color-wisdom, #a855f7); filter: drop-shadow(0 0 6px var(--color-wisdom, #a855f7)); }
        .lotus circle.progress  { stroke: var(--color-lotus, #ff66cc); filter: drop-shadow(0 0 6px var(--color-lotus, #ff66cc)); }
        .bounty circle.progress { stroke: var(--color-bounty, #ff9900); filter: drop-shadow(0 0 6px var(--color-bounty, #ff9900)); }
        .water-rune circle.progress { stroke: var(--color-water, #00d2ff); filter: drop-shadow(0 0 6px var(--color-water, #00d2ff)); }
        
        .active-rune circle.progress { 
            stroke: var(--color-active, #cbd5e1); 
            filter: drop-shadow(0 0 10px var(--color-active, #cbd5e1)); 
            animation: platPulse 1s infinite alternate; 
        }

        @keyframes platPulse { from { opacity: 0.6; } to { opacity: 1; } }

        #wisdom-top-left  { top: 45%; left: 4%; }
        #wisdom-bot-right { top: 56%; left: 96%; }
        #lotus-top        { top: 26%; left: 7.5%; }
        #lotus-bot        { top: 76%; left: 92.5%; }
        #bounty-top       { top: 25%; left: 44%; }
        #bounty-bot       { top: 77%; left: 53%; }
        #river-top        { top: 44%; left: 41%; }
        #river-bot        { top: 57%; left: 57%; }
    </style>
</head>
<body>

    <div class="minimap-overlay" id="minimap">
        <div class="spawn-node wisdom" id="wisdom-top-left"><svg viewBox="0 0 40 40"><circle class="bg" cx="20" cy="20" r="16"/><circle class="progress" id="wtl-p" cx="20" cy="20" r="16" pathLength="100"/><text x="20" y="20">📖</text></svg></div>
        <div class="spawn-node lotus" id="lotus-top"><svg viewBox="0 0 40 40"><circle class="bg" cx="20" cy="20" r="16"/><circle class="progress" id="lt-p" cx="20" cy="20" r="16" pathLength="100"/><text x="20" y="20">🪷</text></svg></div>
        <div class="spawn-node bounty" id="bounty-top"><svg viewBox="0 0 40 40"><circle class="bg" cx="20" cy="20" r="16"/><circle class="progress" id="bt-p" cx="20" cy="20" r="16" pathLength="100"/><text x="20" y="20">🪙</text></svg></div>

        <div class="spawn-node river-node" id="river-top"><svg viewBox="0 0 40 40"><circle class="bg" cx="20" cy="20" r="16"/><circle class="progress" id="rt-p" cx="20" cy="20" r="16" pathLength="100"/><text x="20" y="20" id="rt-icon">🪙</text></svg></div>
        <div class="spawn-node river-node" id="river-bot"><svg viewBox="0 0 40 40"><circle class="bg" cx="20" cy="20" r="16"/><circle class="progress" id="rb-p" cx="20" cy="20" r="16" pathLength="100"/><text x="20" y="20" id="rb-icon">🪙</text></svg></div>

        <div class="spawn-node bounty" id="bounty-bot"><svg viewBox="0 0 40 40"><circle class="bg" cx="20" cy="20" r="16"/><circle class="progress" id="bb-p" cx="20" cy="20" r="16" pathLength="100"/><text x="20" y="20">🪙</text></svg></div>
        <div class="spawn-node lotus" id="lotus-bot"><svg viewBox="0 0 40 40"><circle class="bg" cx="20" cy="20" r="16"/><circle class="progress" id="lb-p" cx="20" cy="20" r="16" pathLength="100"/><text x="20" y="20">🪷</text></svg></div>
        <div class="spawn-node wisdom" id="wisdom-bot-right"><svg viewBox="0 0 40 40"><circle class="bg" cx="20" cy="20" r="16"/><circle class="progress" id="wbr-p" cx="20" cy="20" r="16" pathLength="100"/><text x="20" y="20">📖</text></svg></div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        const overlay = document.getElementById('minimap');

        const activeIcons = ['⚡', '⚔️', '🛡️', '🌀', '✨', '🏃'];
        let activeIconIdx = 0;

        setInterval(() => {
            activeIconIdx = (activeIconIdx + 1) % activeIcons.length;
            if (currentClockTime >= 240) {
                const rtIcon = document.getElementById('rt-icon');
                const rbIcon = document.getElementById('rb-icon');
                if (rtIcon) rtIcon.textContent = activeIcons[activeIconIdx];
                if (rbIcon) rbIcon.textContent = activeIcons[activeIconIdx];
            }
        }, 800);

        let userOpacity = 0.7;
        let altOnlyMode = true;
        let isAltPressed = false;
        let enabledRunesConfig = {};
        let currentClockTime = 0;

        ipcRenderer.on('apply-config', (event, cfg) => {
            overlay.style.width = cfg.size + 'px';
            overlay.style.height = cfg.size + 'px';
            document.documentElement.style.setProperty('--node-size', cfg.iconScale + 'px');
            document.documentElement.style.setProperty('--border-color', cfg.borderColor || '#cbd5e1');

            if (cfg.position === 'right') overlay.classList.add('pos-right');
            else overlay.classList.remove('pos-right');
            
            if (cfg.showBorder) overlay.classList.remove('no-border');
            else overlay.classList.add('no-border');

            if (!cfg.showIcons) overlay.classList.add('hide-icons');
            else overlay.classList.remove('hide-icons');

            if (cfg.colors) {
                document.documentElement.style.setProperty('--color-wisdom', cfg.colors.wisdom);
                document.documentElement.style.setProperty('--color-lotus', cfg.colors.lotus);
                document.documentElement.style.setProperty('--color-bounty', cfg.colors.bounty);
                document.documentElement.style.setProperty('--color-water', cfg.colors.water);
                document.documentElement.style.setProperty('--color-active', cfg.colors.active);
            }

            enabledRunesConfig = cfg.enabledRunes || {};
            userOpacity = cfg.opacity;
            altOnlyMode = cfg.altOnly;

            updateVisibility();
            updateRuneStates(currentClockTime);
        });

        ipcRenderer.on('alt-state', (event, pressed) => {
            isAltPressed = pressed;
            updateVisibility();
        });

        function updateVisibility() {
            if (!altOnlyMode || isAltPressed) overlay.style.opacity = userOpacity;
            else overlay.style.opacity = 0;
        }

        ipcRenderer.on('gsi-clock', (event, clockTime) => {
            currentClockTime = clockTime;
            updateRuneStates(clockTime);
        });

        function updateRuneStates(clockTime) {
            document.querySelectorAll('.wisdom').forEach(el => el.style.display = enabledRunesConfig.wisdom ? 'block' : 'none');
            document.querySelectorAll('.lotus').forEach(el => el.style.display = enabledRunesConfig.lotus ? 'block' : 'none');
            document.querySelectorAll('.bounty').forEach(el => el.style.display = enabledRunesConfig.bounty ? 'block' : 'none');

            const rtNode = document.getElementById('river-top');
            const rbNode = document.getElementById('river-bot');
            const rtIcon = document.getElementById('rt-icon');
            const rbIcon = document.getElementById('rb-icon');

            let isRiverVisible = false;

            if (clockTime <= 0) {
                rtIcon.textContent = '🪙'; 
                rbIcon.textContent = '🪙';
                rtNode.className = 'spawn-node river-node bounty';
                rbNode.className = 'spawn-node river-node bounty';
                isRiverVisible = enabledRunesConfig.bounty;
            } else if (clockTime < 240) {
                rtIcon.textContent = '💧'; 
                rbIcon.textContent = '💧';
                rtNode.className = 'spawn-node river-node water-rune';
                rbNode.className = 'spawn-node river-node water-rune';
                isRiverVisible = enabledRunesConfig.water;
            } else {
                rtIcon.textContent = activeIcons[activeIconIdx];
                rbIcon.textContent = activeIcons[activeIconIdx];
                rtNode.className = 'spawn-node river-node active-rune';
                rbNode.className = 'spawn-node river-node active-rune';
                isRiverVisible = enabledRunesConfig.active;
            }

            rtNode.style.display = isRiverVisible ? 'block' : 'none';
            rbNode.style.display = isRiverVisible ? 'block' : 'none';

            if (clockTime >= 0) {
                const p3 = (clockTime % 180) / 180;
                const p2 = (clockTime % 120) / 120;
                const p7 = (clockTime % 420) / 420;

                ['bt-p','bb-p','lt-p','lb-p'].forEach(id => updateRing(id, p3));
                ['rt-p','rb-p'].forEach(id => updateRing(id, p2));
                ['wtl-p','wbr-p'].forEach(id => updateRing(id, p7));
            }
        }

        function updateRing(id, progress) {
            const el = document.getElementById(id);
            if (el) el.style.strokeDashoffset = 100 - (progress * 100);
        }
    </script>
</body>
</html>
